<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="google-adsense-account" content="ca-pub-9998958180062429">
<title>고기 타이밍 챌린지 | 고기타임</title>
<meta name="description" content="움직이는 바늘이 완벽한 굽기 구간에 왔을 때 뒤집어서 점수를 얻는 타이밍 게임입니다.">
<link rel="canonical" href="https://jinaplus-svg.github.io/game.html">
<link rel="stylesheet" href="style.css">
<style>
  .game-wrap { max-width: 480px; margin: 0 auto; text-align: center; }
  .game-stage {
    position: relative; background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 24px 20px 28px; margin-top: 18px;
  }
  .score-row { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 14px; font-size: 0.95rem; }
  .score-row span:last-child { color: var(--accent); }
  .bar-track {
    position: relative; height: 34px; border-radius: 999px; overflow: hidden;
    background: linear-gradient(to right, #7fb2e0 0%, #7fb2e0 15%, #e8c27a 15%, #e8c27a 35%, #4caf62 35%, #4caf62 50%, #d98b3f 50%, #d98b3f 70%, #8a5a34 70%, #8a5a34 100%);
    border: 2px solid var(--border);
  }
  .zone-label { display:flex; justify-content:space-between; font-size:0.68rem; color:var(--ink-soft); margin-top:6px; padding: 0 2px;}
  .needle {
    position: absolute; top: -6px; width: 6px; height: 46px; background: var(--ink);
    border-radius: 3px; left: 0%; box-shadow: 0 0 0 2px var(--surface);
  }
  .flip-btn {
    margin-top: 22px; width: 100%; padding: 18px; font-size: 1.2rem; font-weight: 800;
    border-radius: 14px; border: none; background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  .flip-btn:active { transform: scale(0.97); }
  .msg { min-height: 1.4em; margin-top: 12px; font-weight: 700; }
  .msg.good { color: #2f8f45; }
  .msg.bad { color: var(--accent); }
  .overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.55); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 16px; gap: 14px;
  }
  .overlay h2 { margin: 0; font-size: 1.6rem; }
  .overlay button {
    padding: 12px 28px; border-radius: 999px; border: none; background: var(--accent);
    color: var(--accent-ink); font-weight: 800; font-size: 1rem; cursor: pointer;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">🍖 고기타임</a>
    <nav>
      <a href="index.html">홈</a>
      <a href="calculator.html">굽기 계산기</a>
      <a href="game.html" class="active">타이밍 게임</a>
      <a href="about.html">소개</a>
    </nav>
  </div>
</header>

<main class="wrap">
<article class="game-wrap">
  <h1>🔥 고기 타이밍 챌린지</h1>
  <p class="intro">바늘이 초록색 "완벽 구간"에 왔을 때 뒤집기 버튼을 눌러 점수를 쌓아보세요.
  라운드가 지날수록 바늘이 점점 빨라집니다!</p>

  <div class="game-stage">
    <div class="score-row">
      <span>ROUND <span id="round">1</span></span>
      <span>점수 <span id="score">0</span></span>
    </div>
    <div class="bar-track" id="track">
      <div class="needle" id="needle"></div>
    </div>
    <div class="zone-label"><span>레어</span><span>미디엄레어</span><span>완벽!</span><span>미디엄웰</span><span>웰던</span></div>
    <button class="flip-btn" id="flipBtn">뒤집기! 🥩</button>
    <p class="msg" id="msg"></p>

    <div class="overlay" id="startOverlay">
      <h2>고기 타이밍 챌린지</h2>
      <p>초록 구간에서 뒤집으면 +1점, 놓치면 게임 종료!</p>
      <button id="startBtn">시작하기</button>
    </div>
    <div class="overlay" id="overOverlay" hidden>
      <h2>게임 종료!</h2>
      <p>최종 점수: <strong id="finalScore">0</strong>점</p>
      <button id="retryBtn">다시 하기</button>
    </div>
  </div>
</article>
</main>

<div class="ad-slot" aria-label="advertisement">
  <span class="ad-slot-label">광고</span>
</div>
<footer class="site-footer">
  <div class="wrap">
    <p>&copy; 2026 고기타임. 게임은 재미를 위한 콘텐츠이며 실제 조리 시간과는 무관합니다.</p>
    <p><a href="about.html">소개</a> · <a href="privacy.html">개인정보처리방침</a></p>
  </div>
</footer>

<script>
const needle = document.getElementById('needle');
const track = document.getElementById('track');
const flipBtn = document.getElementById('flipBtn');
const scoreEl = document.getElementById('score');
const roundEl = document.getElementById('round');
const msgEl = document.getElementById('msg');
const startOverlay = document.getElementById('startOverlay');
const overOverlay = document.getElementById('overOverlay');
const startBtn = document.getElementById('startBtn');
const retryBtn = document.getElementById('retryBtn');
const finalScoreEl = document.getElementById('finalScore');

const PERFECT_ZONE = [35, 50]; // percent range matching the green band in the CSS gradient

let pos = 0, dir = 1, speed = 0.9, score = 0, round = 1, rafId = null, running = false;

function trackWidth() { return track.clientWidth; }

function tick() {
  if (!running) return;
  pos += dir * speed;
  if (pos >= 100) { pos = 100; dir = -1; }
  if (pos <= 0) { pos = 0; dir = 1; }
  const needleW = 6;
  const maxLeft = trackWidth() - needleW;
  needle.style.left = (pos / 100 * maxLeft) + 'px';
  rafId = requestAnimationFrame(tick);
}

function startGame() {
  score = 0; round = 1; speed = 0.9; pos = 0; dir = 1;
  scoreEl.textContent = score; roundEl.textContent = round;
  msgEl.textContent = ''; msgEl.className = 'msg';
  startOverlay.hidden = true; overOverlay.hidden = true;
  running = true;
  cancelAnimationFrame(rafId);
  tick();
}

function endGame() {
  running = false;
  cancelAnimationFrame(rafId);
  finalScoreEl.textContent = score;
  overOverlay.hidden = false;
}

flipBtn.addEventListener('click', () => {
  if (!running) return;
  if (pos >= PERFECT_ZONE[0] && pos <= PERFECT_ZONE[1]) {
    score += 1;
    round += 1;
    speed = Math.min(3.2, speed + 0.18);
    scoreEl.textContent = score;
    roundEl.textContent = round;
    msgEl.textContent = '완벽하게 구웠어요! 🔥';
    msgEl.className = 'msg good';
  } else {
    msgEl.textContent = pos < PERFECT_ZONE[0] ? '덜 익었어요...' : '너무 탔어요!';
    msgEl.className = 'msg bad';
    endGame();
  }
});

startBtn.addEventListener('click', startGame);
retryBtn.addEventListener('click', startGame);

window.addEventListener('resize', () => {
  if (!running) return;
  const needleW = 6;
  const maxLeft = trackWidth() - needleW;
  needle.style.left = (pos / 100 * maxLeft) + 'px';
});
</script>
</body>
</html>
